server {
  listen 80;
  server_name _;
  
  root /usr/share/nginx/html;
  index index.html;
  
  # Disable caching for HTML files
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }
  
  # Vite build output ONLY. These filenames carry a content hash
  # (main-v-Nmq-dP.js), so "immutable" is safe — a rebuild changes the name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # Files copied verbatim from public/ keep a STABLE name across deploys —
  # /audio-processor.worklet.js above all. The previous rule matched every *.js
  # and marked it `immutable` for a year, so a browser that had ever loaded the
  # worklet would keep serving the OLD copy after a deploy, with no way to bust
  # it. Any fix to the audio capture path silently did not reach returning
  # users (including anyone re-testing). Revalidate these every time.
  location ~* \.(?:js|css|map)$ {
    add_header Cache-Control "no-cache";
    access_log off;
    try_files $uri =404;
  }
  
  # Images and fonts with caching
  location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|otf)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }
  
  # SPA routing - all other requests return index.html
  # This handles /interview/[session-id] and any other routes
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  
  # Specific handling for interview routes
  location ~ ^/interview/[a-f0-9-]+$ {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  
  # Health check
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
