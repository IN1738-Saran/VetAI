user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { 
  worker_connections 1024; 
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  
  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  
  access_log /var/log/nginx/access.log main;
  
  # Performance
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  types_hash_max_size 4096;
  server_tokens off;
  
  # File upload size (for resume uploads)
  client_max_body_size 500m;
  client_body_timeout 300s;
  
  # Gzip compression
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types 
    text/plain 
    text/css 
    text/xml 
    text/javascript
    application/json 
    application/javascript 
    application/xml+rss 
    application/xml
    image/svg+xml;
  
  # WebSocket upgrade support
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
  
  # Docker service names
  upstream frontend {
    server frontend:80;
    keepalive 32;
  }

  upstream admin_frontend {
    server admin-frontend:80;
    keepalive 32;
  }

  upstream backend {
    server backend:3001;
    keepalive 32;
  }
  
  # HTTP -> HTTPS redirect
  server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    
    # Redirect everything else to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }
  
  # HTTPS server
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;
    
    # SSL certificates
    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;
    
    # SSL configuration (Mozilla Intermediate)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP stapling (optional, but recommended)
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Default proxy settings for all locations
    proxy_http_version 1.1;
    proxy_buffering off;
    
    # CRITICAL: These headers tell backend the real protocol and host
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   $server_port;
    
    # Timeouts
    proxy_connect_timeout 300s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    
    # ========================================
    # BACKEND - API routes (must come first)
    # ========================================
    
    # Redirect /api without trailing slash to /api/
    location = /api {
      return 301 $scheme://$host/api/;
    }
    
    # ── VOICE WEBSOCKET ────────────────────────────────────────────────────
    # Must be its own location. The generic /api/ block below inherits
    # proxy_read_timeout 300s, which for a WebSocket means "close the connection
    # if the upstream sends nothing for 5 minutes". Interviews run 30–60 minutes
    # and Azure sends nothing at all while the candidate sits thinking, so a long
    # pause silently killed the socket mid-interview and forced a reconnect.
    #
    # A regex location wins over the /api/ prefix location regardless of order.
    location ~ ^/api/interview/[^/]+/voice-stream$ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Never buffer or compress a realtime audio stream.
      proxy_buffering off;
      gzip off;

      # Comfortably longer than the 60-minute hard cap on an interview.
      proxy_connect_timeout 30s;
      proxy_read_timeout    3900s;
      proxy_send_timeout    3900s;
    }

    # All API routes
    location /api/ {
      # WebSocket support
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      
      # IMPORTANT: No trailing slash to preserve the full path
      proxy_pass http://backend;
      
      # Don't cache API responses
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      
      # CORS headers (if needed)
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
      
      # Handle preflight requests
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
      }
    }
    
    # ========================================
    # ADMIN FRONTEND - new recruiter panel (UI overhaul, additive)
    # ========================================

    # Redirect /admin without trailing slash to /admin/
    location = /admin {
      return 301 $scheme://$host/admin/;
    }

    # Trailing slash on proxy_pass strips the /admin/ prefix before
    # forwarding, so the admin-frontend container is served as if it lived
    # at its own root (see admin-frontend/nginx.conf and vite.config.ts).
    location /admin/ {
      proxy_pass http://admin_frontend/;
    }

    # ========================================
    # FRONTEND - All other routes
    # ========================================

    # Frontend handles SPA routing internally now
    # Just proxy everything to frontend
    location / {
      proxy_pass http://frontend;
    }
    
    # Health check endpoint
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }
    
    # Deny access to hidden files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}
