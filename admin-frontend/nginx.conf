server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Disable caching for HTML - always fetch the latest shell.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Vite build output only - content-hashed filenames, safe to cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # SPA routing - reverse-proxy strips the /admin/ prefix before forwarding
  # here (proxy_pass http://admin-frontend/;), so this app is served as if
  # it lived at the root; React Router's basename="/admin" keeps the
  # browser's own address bar correct.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
