version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: interview-backend
    env_file:
      - ./backend/.env   # put Azure Blob, etc. here
    expose:
      - "3001"
    networks: [appnet]
    # If your backend serves static admin on /, keep as-is.

  frontend:
    build:
      context: ./frontend
    container_name: interview-frontend
    env_file:
      - ./frontend/.env
    expose:
      - "80"
    networks: [appnet]

  admin-frontend:
    build:
      context: ./admin-frontend
    container_name: interview-admin-frontend
    expose:
      - "80"
    networks: [appnet]

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: interview-proxy
    depends_on:
      - frontend
      - admin-frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/certs/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - ./reverse-proxy/certs/privkey.pem:/etc/ssl/private/privkey.pem:ro
    networks: [appnet]

networks:
  appnet:
    driver: bridge

